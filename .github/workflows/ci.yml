# ============================================================
# SONAR-INTEL CI Pipeline
# Runs on every push and pull request to main
# ============================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run test suite
        env:
          DATABASE_URL: ""
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_drishti_detector.py \
            --ignore=tests/test_inference_api.py \
            -v --tb=short

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: |
          ruff check backend/ ml/ tests/ conftest.py --select E,F,W --ignore E501 || true

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend-new
        run: npm ci --silent

      - name: TypeScript build check
        working-directory: frontend-new
        run: npm run build
